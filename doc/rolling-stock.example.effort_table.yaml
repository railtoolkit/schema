%YAML 1.2
---
schema: https://railtoolkit.org/schema/rolling-stock.json
schema_version: "2024.07"
model_fidelity: "effort_tables"  # Options: "simplified_characteristics", "effort_tables", "physical_model"
trains:
  - id: IC2000-effort_tables
    description: "Intercity with locomotive BR193, 2 first class, 1 dining car and 5 second class coaches"
    formation: [Vectron,Avmmz,Avmmz,WRkmz,Bpmmz,Bpmmz,Bpmmz,Bpmmz,Bpmmz]
    loading_factor: [1.0,0.6,0.6,0.4,0.8,0.8,0.8,0.8,0.8]

vehicles:
  - id: Vectron # (required)
    vehicle_type: traction unit
    power_type: electric
    picture: https://commons.wikimedia.org/wiki/File:Siemens_Vectron_193_837.jpg
    ## main attributes
    length: 18.98          # in m    (required)
    mass: 89.0             # in t    (required)
    speed_limit: 200       # in km/h (required)
    # coefficients for the vehicles resistance
    resistances:
      rotation_mass: 1.09  # source: "Railway Timetabling & Operations" by Hansen, et al., 2014, p. 71 for the traction unit
      base_resistance: 2.2 # source: "Fahrdynamik des Schienenverkehrs" by Wende, 2003, p. 151 for "4-achsige Diesellokomot." -> 2.2 ‰ to 3.5 ‰
      rolling_resistance: 1.4 # source: "Fahrdynamik des Schienenverkehrs" by Wende, 2003, p. 151 for "f_WW0" -> 1.2 ‰ to 1.6 ‰
      air_resistance: 6.0  # source: "Fahrdynamik des Schienenverkehrs" by Wende, 2003, p. 151 for "4-achsig, eckige Kopfform" with "Stromabnehmer" -> 5000 N to 6000 N; modified for the used formula
    traction:
      mass_traction: 89.0  # in t (mass on driving axles)
      #power: 4500         # kW
      # tractive effort as pairs of speed and tractive effort
      tractive_effort:
        - speed: 0
          effort: 10000
        - speed: 100
          effort: 10000
        - speed: 200
          effort: 10000
    brakes:


  - id: Avmmz
    description: "First class car"
    vehicle_type: passenger
    ## main attributes
    length: 26.4           # in m    (required)
    mass: 47.0             # in t    (required)
    load_limit: 10.8       # in t    (required)
    speed_limit: 200       # in km/h (required)
  
  - id: WRkmz
    description: "dining car"
    vehicle_type: passenger
    ## main attributes
    length: 26.4           # in m    (required)
    mass: 52.0             # in t    (required)
    load_limit: 12.0       # in t    (required)
    speed_limit: 200       # in km/h (required)
  
  - id: Bpmmz
    description: "Second class car"
    vehicle_type: passenger
    ## main attributes
    length: 26.4           # in m    (required)
    mass: 45.0             # in t    (required)
    load_limit: 16.0       # in t    (required)
    speed_limit: 200       # in km/h (required)

